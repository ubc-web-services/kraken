# kraken.libraries.yml

## Global Styles & Scripts
global:
  css:
    theme:
      css/clf.min.css: { minified: true }
      css/clf.navigation.min.css: { minified: true }
      css/bootstrap.5.min.css: { minified: true }
      css/styles.min.css: { minified: true, preprocess: false }
  js:
    https://cdndevl2.cdn.ubc.ca/ubc/ubc-brand/1.4.0-issue-32.0/js/ubc-digital-brand.js: { type: external, minified: true, attributes: { defer: true, charset: utf-8, type: module } }
    js/kraken.clf.js: { minified: true }
    js/kraken.dismiss.min.js: { minified: true }
    js/kraken.video.min.js: { minified: true }
    js/kraken.misc.min.js: { minified: true }
    js/kraken.mediaquery.min.js: { minified: true }
    js/vendors~bootstrap.min.js: { minified: true, preprocess: false }
    js/bootstrap.min.js: { minified: true }
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings


### CLF Dark Mode (one day...)
clf-dark-mode:
  version: VERSION
  css:
    base:
      css/clf.dark.mode.min.css: { minified: true }

## Whitney Font
### Development Version
clf-whitney-dev:
  version: VERSION
  css:
    base:
      https://cloud.typography.com/7574694/7103192/css/fonts.css: { type: external, minified: true }

### Production Version
clf-whitney-prod:
  version: VERSION
  css:
    base:
      https://cloud.typography.com/6804272/781004/css/fonts.css: { type: external, minified: true }

## libraries from starterkit
dialog:
  version: VERSION
  css:
    component:
      css/components/dialog.css:
        weight: -10

dropbutton:
  version: VERSION
  css:
    component:
      css/components/dropbutton.css:
        weight: -10

progress:
  version: VERSION
  css:
    component:
      css/components/progress.css:
        weight: -10

user:
  version: VERSION
  css:
    component:
      css/components/user.css:
        weight: -10

## Additional custom libraries
### Login / Register / Password Reset pages
drupal-login:
  version: VERSION
  css:
    theme:
      css/drupal.login.min.css: { minified: true }

### Local Task Files
local-tasks:
  version: VERSION
  css:
    theme:
      css/drupal.local.tasks.min.css: { minified: true }

### Maintenance Page
maintenance-page:
  version: VERSION
  css:
    theme:
      css/drupal.maintenance.page.min.css: { minified: true }

## Custom JS Libraries
### Alert content entities
alert-display:
  js:
    js/kraken.alert.display.min.js: { minified: true }
  dependencies:
    - core/drupal
    - core/once

### Bootstrap Carousel
bs-carousel:
  js:
    js/kraken.carousel.min.js: { minified: true }
  dependencies:
    - core/drupal
    - core/once
    - core/jquery

### Scroll to top
scroll:
  version: VERSION
  js:
    js/kraken.scroll.min.js: { minified: true }
  dependencies:
    - core/drupal
    - core/drupalSettings

### Sticky-header
sticky-header:
  version: VERSION
  css:
    theme:
      css/clf.stickynav.min.css: { minified: true }
  js:
    js/kraken.sticky.min.js: { minified: true }
  dependencies:
    - core/drupal
    - core/drupalSettings

## Integrations
### FullCalendar
fullcalendar:
  css:
    theme:
      css/fullcalendar.custom.min.css: { minified: true }
