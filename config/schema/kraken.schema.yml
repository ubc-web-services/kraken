# Schema for the configuration files of the kraken theme.

kraken.settings:
  type: theme_settings
  label: 'kraken settings'
  mapping:
    clf_dark_mode:
      type: boolean
      label: 'Dark mode'
    clf_css:
      type: string
      label: 'CSS version'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - 'css-dev'
            - 'css-prod'
    clf_fonts:
      type: string
      label: 'Font version'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - ''
            - 'default'
            - 'legacy-dev'
            - 'legacy-prod'
    clf_8_color:
      type: string
      label: 'CLF 8 Color'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - 'blue'
            - 'white'
    clf_8_layout:
      type: string
      label: 'Layout'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - 'full'
            - 'fixed'
            - 'stretch'
    clf_8_campus:
      type: text
      label: 'Faculty name'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - ''
            - 'Vancouver'
            - 'Okanagan'
    clf_8_faculty:
      type: text
      label: 'Faculty name'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - ''
            - 'Allard School of Law'
            - 'Faculty of Applied Science'
            - 'Faculty of Arts'
            - 'Faculty of Dentistry'
            - 'Faculty of Education'
            - 'Faculty of Forestry'
            - 'Faculty of Land and Food Systems'
            - 'Faculty of Pharmaceutical Sciences'
            - 'Faculty of Science'
            - 'Graduate and Postdoctoral Studies'
            - 'Sauder School of Business'
    clf_8_name:
      type: text
      label: 'Unit name'
    clf_8_unit_text:
      type: boolean
      label: 'Change the unit name colour to allow light coloured backgrounds'
    clf_8_show_mobile_nav_trigger:
      type: boolean
      label: 'Show mobile navigation trigger'
    cwl_site:
      type: boolean
      label: 'Show CWL login'
    clf_sticky:
      type: boolean
      label: 'Make main navigation Sticky'
    clf_navoption:
      type: boolean
      label: 'Nav option'
    clf_unit_campus:
      type: string
      label: 'Unit campus'
    clf_faculty:
      type: boolean
      label: 'Unit is part of faculty'
    clf_theme_unitbar_colour:
      type: color_hex
      label: 'Unit bar color'
    clf_theme_unit_colour:
      type: color_hex
      label: 'Unit primary color'
    clf_theme_secondary_colour:
      type: color_hex
      label: 'Unit secondary color'
    clf_theme_tertiary_colour:
      type: color_hex
      label: 'Unit tertiary color'
    clf_theme_accent_colour:
      type: color_hex
      label: 'Unit accent color'
    clf_theme_link_colour:
      type: color_hex
      label: 'Unit link color'
    clf_theme_link_hover_colour:
      type: color_hex
      label: 'Unit link:hover color'
    clf_theme_link_active_colour:
      type: color_hex
      label: 'Unit link:active color'
    clf_theme_leading:
      type: string
      label: 'Type leading value'
    clf_theme_base_font_size:
      type: string
      label: 'Base font size'
    clf_faculty_name:
      type: text
      label: 'Faculty name'
      constraints:
        Choice:
          # @see kraken_form_system_theme_settings_alter()
          choices:
            - 'Allard School of Law'
            - 'Faculty of Applied Science'
            - 'Faculty of Arts'
            - 'Faculty of Dentistry'
            - 'Faculty of Education'
            - 'Faculty of Forestry'
            - 'Faculty of Land and Food Systems'
            - 'Faculty of Pharmaceutical Sciences'
            - 'Faculty of Science'
            - 'Graduate and Postdoctoral Studies'
            - 'Sauder School of Business'
    clf_streetaddr:
      type: text
      label: 'Street address'
    clf_locality:
      type: text
      label: 'Locality'
    clf_region:
      type: text
      label: 'Region'
    clf_country:
      type: text
      label: 'Country'
    clf_postal:
      type: text
      label: 'Postal code'
    clf_telephone:
      type: string
      label: 'Telephone number'
    clf_fax:
      type: string
      label: 'Fax number'
    clf_email:
      type: email
      label: 'Email'
    clf_website:
      type: text
      label: 'Website'
    clf_social_facebook:
      type: text
      label: 'Facebook account'
    clf_social_instagram:
      type: text
      label: 'Instagram account'
    clf_social_linkedin:
      type: text
      label: 'Linkedin account'
    clf_social_twitter:
      type: text
      label: 'Twitter account'
    clf_social_youtube:
      type: text
      label: 'Youtube account'
    clf_searchdomain:
      type: text
      label: 'Search domain'
    clf_searchlabel:
      type: text
      label: 'Search label'
    clf_noindex:
      type: boolean
      label: 'Do not index option'
